spring.datasource.url=jdbc:h2:mem:sikka;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
openai.api-key=
openai.model=test-model
aladhan.calculation-method=4
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000

# Local invitation link used by tests; no frontend server is required.
sikka.join-url=http://localhost:3000/join

server.servlet.session.timeout=2h
