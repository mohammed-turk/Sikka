spring.application.name=sikka
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3307/sikka
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.timeout-seconds=90

aladhan.calculation-method=4
aladhan.timeout-seconds=15

# Map routes are estimates; configure a verified graph entrance before generating itineraries.
sikka.map.walking-meters-per-minute=${SIKKA_WALKING_METERS_PER_MINUTE:70}
sikka.map.entrance-node-id=${SIKKA_ENTRANCE_NODE_ID:11}

spring.jpa.properties.hibernate.max_fetch_depth=0

# Park entrance coordinates from Nawaf route-data.json (node 11).
sikka.park.latitude=${SIKKA_PARK_LATITUDE:24.5866431}
sikka.park.longitude=${SIKKA_PARK_LONGITUDE:46.3310353}
# Default ride rules are synthetic demo data; select maps/rides-reviewed-seed.json to restore the reviewed dataset.
sikka.park.ride-seed-resource=${SIKKA_RIDE_SEED_RESOURCE:maps/rides-seed.json}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

ultramsg.instance-id=${ULTRAMSG_INSTANCE_ID:}
ultramsg.token=${ULTRAMSG_TOKEN:}

# Google Calendar OAuth - secrets must be set through environment variables
sikka.google.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
sikka.google.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
sikka.google.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/google-calendar/oauth/callback}
sikka.google.encryption-key=${GOOGLE_CALENDAR_ENCRYPTION_KEY:}
sikka.notifications.n8n-url=${SIKKA_N8N_URL:}
sikka.notifications.n8n-key=${SIKKA_N8N_KEY:}
sikka.join-url=${JOIN_URL:http://localhost:3000/join}

moyasar.secret-key=${MOYASAR_SECRET_KEY:}

# Browser sessions used by the frontend gateway; Basic Auth remains available for API clients.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# Optional shared Queue Analytics feed.
sikka.queue-analytics.enabled=${SIKKA_QUEUE_ANALYTICS_ENABLED:false}
sikka.queue-analytics.url=${SIKKA_QUEUE_ANALYTICS_URL:https://queueanalytics-production.up.railway.app}
