name: Verify visit entitlement and reuse
on:
  push:
    branches:
      - fix/visit-entitlement-and-reuse
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run tests (H2)
        run: |
          chmod +x ./mvnw
          ./mvnw -B test
